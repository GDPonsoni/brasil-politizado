# Dois temas próprios: o navegador escolhe pelo modo do sistema, e o usuário pode trocar em
# Configurações (menu ⋮). As cores dos gráficos acompanham o tema ativo (app/graficos.py).
[theme.light]
primaryColor = "#0F766E"
backgroundColor = "#FAFAF7"
secondaryBackgroundColor = "#F0EFEA"
textColor = "#1F2933"

[theme.dark]
primaryColor = "#2BB3A3"
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#262624"
textColor = "#ECEDEA"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
